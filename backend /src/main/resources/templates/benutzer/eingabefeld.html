<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment 1: Normaldarstellung -->
<td th:fragment="ausgeben(loginName, feldname, wert)">
    <span th:text="${wert}"
          th:hx-get="@{/admin/benutzer/{ln}/hx/feld/{fn}(ln=${loginName},fn=${feldname})}"
          hx-trigger="click"
          hx-target="closest td"
          hx-swap="outerHTML"
          style="cursor: pointer;">
    </span>
</td>
<!-- Fragment 2: Bearbeitungsformular -->
<td th:fragment="bearbeiten(loginName, feldname, wert)">
    <form th:hx-put="@{/admin/benutzer/{ln}/hx/feld/{fn}(ln=${loginName},fn=${feldname})}"
          hx-target="closest td"
          hx-swap="outerHTML">
        <input type="text" name="wert" th:value="${wert}"
               th:style="${fehler} ? 'border: 2px solid red;' : ''"/>
        <span th:if="${fehler}" style="color: red;" th:text="${fehlermeldung}">Ungültiger Wert!</span>
        <button type="submit">OK</button>
    </form>
</td>

</body>
</html>
