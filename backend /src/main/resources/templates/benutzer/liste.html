<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
    <meta charset="UTF-8">

    <script src="https://unpkg.com/htmx.org@2.0.4" 
        integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" 
        crossorigin="anonymous">
    </script>

    <title th:text="#{benutzer.liste.titel}">
        Benutzerliste
    </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
        }

        .seitenkopf {
            background: #2b405b;
            width: 100%;
            padding: 24px 0;
            margin: 0 0 36px 0;
        }

        .kopf-inhalt {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .kopf-links {
            display: flex;
            align-items: center;
            gap: 32px;
        }

        .app-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: white;
        }

        .hauptnavigation,
        .sprachwahl,
        .login-status {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .hauptnavigation a,
        .sprachwahl a,
        .login-status a,
        .login-status span {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        .hauptnavigation a:hover,
        .sprachwahl a:hover,
        .login-status a:hover {
            opacity: 0.75;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px 40px 40px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #cbd5e1;
            padding: 12px;
            text-align: left;
        }

        th {
            background: #2b405b;
            color: white;
        }

        table a {
            text-decoration: none;
            margin-right: 10px;
            color: #2b405b;
            font-weight: bold;
        }

        h1 {
            color: #2b405b;
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/kopffuss :: kopf}"></div>

<div class="container">

<h1 th:text="#{benutzer.liste.titel}">
    Benutzerliste
</h1>

<table>
    <thead>
    <tr>
        <th th:text="#{benutzer.loginname}">
            Loginname
        </th>

        <th th:text="#{benutzer.name}">
            Name
        </th>

        <th th:text="#{benutzer.email}">
            E-Mail
        </th>

        <th th:text="#{benutzer.rolle}">
            Rolle
        </th>

        <th th:text="#{benutzer.aktionen}">
            Aktionen
        </th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="b : ${benutzerliste}">
        <td th:text="${b.loginName}"></td>
        <td th:replace="~{benutzer/eingabefeld :: ausgeben(loginName=${b.loginName},feldname='name',wert=${b.name})}"></td>
        <td th:replace="~{benutzer/eingabefeld :: ausgeben(loginName=${b.loginName},feldname='email',wert=${b.email})}"></td>
        <td th:text="${b.rolle}"></td>

        <td>
            <a th:href="@{/admin/benutzer/{loginname}(loginname=${b.loginName})}"
               th:text="#{button.bearbeiten}">
                Bearbeiten
            </a>

            <a th:href="@{/admin/benutzer/{loginname}/delete(loginname=${b.loginName})}"
               th:text="#{button.loeschen}">
                Löschen
            </a>
        </td>
    </tr>
    </tbody>

</table>

</div>

<div th:replace="~{fragments/kopffuss :: fuss}"></div>

</body>
</html>
