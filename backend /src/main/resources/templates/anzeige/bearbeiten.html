<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="de">

<head>
    <meta charset="UTF-8">

    <title th:text="${anzeigeFormular.id == 0}
            ? #{anzeige.bearbeiten.neu.titel}
            : #{anzeige.bearbeiten.titel}">
        Anzeige bearbeiten
    </title>

    <style>
    :root {
        --bg: #eef2f7;
        --card: #ffffff;
        --accent: #2b405b;
        --text: #1f2937;
        --muted: #4b5563;
        --border: #cbd5e1;
    }

    body {
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
    }

    .seitenkopf {
        background: var(--accent);
        width: 100%;
        padding: 24px 0;
        margin: 0 0 36px 0;
    }

    .seitenfuss {
        background: var(--accent);
        width: 100%;
        height: 48px;
        margin-top: 40px;
    }

    .content-width {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 20px;
        box-sizing: border-box;
    }

    .kopf-inhalt {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .kopf-links {
        display: flex;
        align-items: center;
        gap: 32px;
    }

    .app-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: var(--card);
    }

    .hauptnavigation {
        display: flex;
        gap: 18px;
    }

    .hauptnavigation a {
        color: var(--card);
        text-decoration: none;
        font-weight: 600;
        font-size: 1rem;
    }

    .sprachwahl {
        display: flex;
        gap: 12px;
    }

    .sprachwahl a {
        color: var(--card);
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95rem;
    }

    h1,
    form {
        max-width: 720px;
        margin: 0 auto;
        box-sizing: border-box;
    }

    h1 {
        font-size: 2rem;
        font-weight: 600;
        color: var(--accent);
        margin: 50px auto 28px auto;
        padding: 0 20px;
    }

    form {
        background: var(--card);
        padding: 32px 36px;
        border-radius: 18px;
        border: 1px solid var(--border);
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 18px;
        gap: 18px;
    }

    .form-row label {
        width: 190px;
        flex-shrink: 0;
        font-weight: 600;
        color: var(--muted);
    }

    .form-row input,
    .form-row textarea {
        flex: 1;
        padding: 10px 12px;
        font-size: 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: white;
        color: var(--text);
    }

    .form-row textarea {
        min-height: 110px;
        resize: vertical;
    }

    .field-error {
        border: 2px solid red !important;
    }

    .error-text {
        color: red;
        font-size: 0.9rem;
        margin-left: 208px;
        margin-top: -10px;
        margin-bottom: 14px;
    }

    .buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 32px;
        gap: 16px;
    }

    button,
    .button-link {
        padding: 10px 26px;
        font-size: 1rem;
        border-radius: 8px;
        border: 1px solid var(--accent);
        cursor: pointer;
        text-decoration: none;
    }

    button[type="submit"] {
        background: var(--accent);
        color: white;
    }

    .button-link {
        background: transparent;
        color: var(--accent);
    }
</style>
</head>

<body>

<div th:replace="~{fragments/kopffuss :: kopf}"></div>

<h1 th:text="${anzeigeFormular.id == 0}
        ? #{anzeige.bearbeiten.neu.titel}
        : #{anzeige.bearbeiten.titel}">
    Anzeige bearbeiten
</h1>

<form method="post"
      th:object="${anzeigeFormular}"
      th:action="@{/admin/anzeige/{id}(id=${anzeigeFormular.id})}">

    <input type="hidden" name="id" th:value="${anzeigeFormular.id}">
    <input type="hidden" name="version" th:value="${anzeigeFormular.version}">

    <div class="form-row">
        <label for="titel" th:text="#{anzeige.liste.spalte.titel}">
            Titel
        </label>

        <input id="titel"
               type="text"
               th:field="*{titel}"
               th:errorclass="field-error">
    </div>
    <div class="error-text"
         th:if="${#fields.hasErrors('titel')}"
         th:errors="*{titel}">
        Fehler beim Titel
    </div>

    <div class="form-row">
        <label for="beschreibung" th:text="#{anzeige.bearbeiten.beschreibung}">
            Beschreibung
        </label>

        <textarea id="beschreibung"
                  th:field="*{beschreibung}"
                  th:errorclass="field-error">
        </textarea>
    </div>
    <div class="error-text"
         th:if="${#fields.hasErrors('beschreibung')}"
         th:errors="*{beschreibung}">
        Fehler bei der Beschreibung
    </div>

    <div class="form-row">
        <label for="preis" th:text="#{anzeige.bearbeiten.preis}">
            Preis
        </label>

        <input id="preis"
               type="number"
               th:field="*{preis}"
               th:errorclass="field-error">
    </div>
    <div class="error-text"
         th:if="${#fields.hasErrors('preis')}"
         th:errors="*{preis}">
        Fehler beim Preis
    </div>

    <div class="form-row">
        <label for="anzahl" th:text="#{anzeige.bearbeiten.anzahl}">
            Anzahl
        </label>

        <input id="anzahl"
               type="number"
               th:field="*{anzahl}"
               th:errorclass="field-error">
    </div>
    <div class="error-text"
         th:if="${#fields.hasErrors('anzahl')}"
         th:errors="*{anzahl}">
        Fehler bei der Anzahl
    </div>

    <div class="form-row">
        <label for="ablaufdatum" th:text="#{anzeige.bearbeiten.ablaufdatum}">
            Ablaufdatum
        </label>

    <input id="ablaufdatum"
        type="date"
        name="ablaufdatum"
        th:value="${anzeigeFormular.ablaufdatum != null ? #temporals.format(anzeigeFormular.ablaufdatum, 'yyyy-MM-dd') : ''}"
        th:classappend="${#fields.hasErrors('ablaufdatum')} ? 'field-error'">

    </div>
    <div class="error-text"
         th:if="${#fields.hasErrors('ablaufdatum')}"
         th:errors="*{ablaufdatum}">
        Fehler beim Ablaufdatum
    </div>

    <div class="buttons">
        <a class="button-link"
           th:href="@{/admin/anzeige}"
           th:text="#{anzeige.bearbeiten.abbrechen}">
            Abbrechen
        </a>

        <button type="submit"
                th:text="#{anzeige.bearbeiten.ok}">
            OK
        </button>
    </div>

</form>

<div th:replace="~{fragments/kopffuss :: fuss}"></div>

</body>
</html>
